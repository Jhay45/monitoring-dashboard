<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitoring Dashboard</title>
  <style>
    :root {
      --bg1: #0f172a;
      --bg2: #111827;
      --panel: rgba(15, 23, 42, 0.8);
      --card: rgba(30, 41, 59, 0.9);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --green: #34d399;
      --amber: #fbbf24;
      --red: #f87171;
      --purple: #a78bfa;
      --cyan: #22d3ee;
      --white: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    .dashboard {
      width: 100%;
      max-width: 1100px;
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      padding: 32px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 32px;
    }

    .header h1 {
      font-size: clamp(2rem, 4vw, 3rem);
      margin: 0;
      letter-spacing: 0.04em;
    }

    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(52, 211, 153, 0.12);
      border: 1px solid rgba(52, 211, 153, 0.4);
      color: var(--green);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .live-dot {
      width: 10px;
      height: 10px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 15px var(--green);
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.5); opacity: 0.55; }
      100% { transform: scale(1); opacity: 1; }
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(170px, 1fr));
      gap: 18px;
    }

    .dash-btn {
      position: relative;
      border: none;
      border-radius: 18px;
      min-height: 120px;
      color: var(--white);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.28);
      overflow: hidden;
    }

    .dash-btn:hover {
      transform: translateY(-4px);
      filter: brightness(1.08);
      box-shadow: 0 14px 26px rgba(0, 0, 0, 0.35);
    }

    .dash-btn:before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.18), transparent 50%);
      pointer-events: none;
    }

    .icon {
      font-size: 1.9rem;
    }

    .dash-btn .button-label {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      line-height: 1.2;
    }

    .button-title {
      font-size: 1.2rem;
    }

    .button-subtitle {
      font-size: 0.75rem;
      opacity: 0.9;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .btn-1 { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
    .btn-2 { background: linear-gradient(135deg, #10b981, #059669); }
    .btn-3 { background: linear-gradient(135deg, #f59e0b, #d97706); }
    .btn-4 { background: linear-gradient(135deg, #ef4444, #b91c1c); }
    .btn-5 { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }
    .btn-6 { background: linear-gradient(135deg, #06b6d4, #0891b2); }
    .btn-7 { background: linear-gradient(135deg, #ec4899, #be185d); }

    @media (max-width: 820px) {
      .button-grid {
        grid-template-columns: repeat(2, minmax(170px, 1fr));
      }
    }

    @media (max-width: 480px) {
      .dashboard {
        padding: 18px;
      }

      .button-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <div class="header">
      <h1>Monitoring Dashboard</h1>
      <div class="live-pill"><span class="live-dot"></span> Live</div>
    </div>

    <div class="button-grid">
      <button class="dash-btn btn-1" aria-label="NM Offset">
        <span class="icon">📊</span>
        <span class="button-label">
          <span class="button-title">NM</span>
          <span class="button-subtitle">Offset</span>
        </span>
      </button>
      <button class="dash-btn btn-2" aria-label="Systems">
        <span class="icon">🖥️</span>
        <span>Systems</span>
      </button>
      <button class="dash-btn btn-3" aria-label="Performance">
        <span class="icon">⚡</span>
        <span>Performance</span>
      </button>
      <button class="dash-btn btn-4" aria-label="Alerts">
        <span class="icon">🚨</span>
        <span>Alerts</span>
      </button>
      <button class="dash-btn btn-5" aria-label="Analytics">
        <span class="icon">📈</span>
        <span>Analytics</span>
      </button>
      <button class="dash-btn btn-6" aria-label="Logs">
        <span class="icon">📝</span>
        <span>Logs</span>
      </button>
      <button class="dash-btn btn-7" aria-label="Reports">
        <span class="icon">📋</span>
        <span>Reports</span>
      </button>
    </div>
  </div>
</body>
</html>
