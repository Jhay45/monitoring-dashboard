<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NM Offset Monitoring Dashboard</title>
  <style>
    :root {
      --bg1: #0f172a;
      --bg2: #111827;
      --panel: rgba(15, 23, 42, 0.8);
      --card: rgba(30, 41, 59, 0.9);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --green: #34d399;
      --amber: #fbbf24;
      --red: #f87171;
      --purple: #a78bfa;
      --cyan: #22d3ee;
      --white: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .dashboard {
      width: 100%;
      max-width: 1400px;
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      padding: 32px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 32px;
    }

    .header h1 {
      font-size: clamp(2rem, 4vw, 2.5rem);
      margin: 0;
      letter-spacing: 0.04em;
    }

    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(52, 211, 153, 0.12);
      border: 1px solid rgba(52, 211, 153, 0.4);
      color: var(--green);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .live-dot {
      width: 10px;
      height: 10px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 15px var(--green);
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.5); opacity: 0.55; }
      100% { transform: scale(1); opacity: 1; }
    }

    .button-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .dash-btn {
      position: relative;
      border: none;
      border-radius: 18px;
      min-height: 100px;
      color: var(--white);
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.28);
      overflow: hidden;
    }

    .dash-btn:hover {
      transform: translateY(-4px);
      filter: brightness(1.08);
      box-shadow: 0 14px 26px rgba(0, 0, 0, 0.35);
    }

    .dash-btn:before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.18), transparent 50%);
      pointer-events: none;
    }

    .btn-nm { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
    .btn-reports { background: linear-gradient(135deg, #ec4899, #be185d); }

    .icon {
      font-size: 1.8rem;
    }

    .form-container {
      display: none;
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 16px;
      padding: 30px;
      margin-top: 20px;
    }

    .form-container.active {
      display: block;
    }

    .form-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 24px;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group label {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .form-group input,
    .form-group select {
      padding: 12px 14px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      font-family: Arial, sans-serif;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
    }

    .display-value {
      padding: 12px 14px;
      background: rgba(52, 211, 153, 0.1);
      border: 1px solid rgba(52, 211, 153, 0.3);
      border-radius: 8px;
      color: var(--green);
      font-size: 1rem;
      font-weight: 600;
      min-height: 44px;
      display: flex;
      align-items: center;
    }

    .form-section {
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.1);
    }

    .form-section:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .section-header {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--cyan);
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .button-group {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 30px;
      flex-wrap: wrap;
    }

    .btn-submit, .btn-reset, .btn-close {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .btn-submit {
      background: linear-gradient(135deg, var(--green), #059669);
      color: var(--white);
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(52, 211, 153, 0.3);
    }

    .btn-reset {
      background: rgba(148, 163, 184, 0.2);
      color: var(--text);
      border: 1px solid rgba(148, 163, 184, 0.4);
    }

    .btn-reset:hover {
      background: rgba(148, 163, 184, 0.3);
    }

    .btn-close {
      background: rgba(248, 113, 113, 0.2);
      color: var(--red);
      border: 1px solid rgba(248, 113, 113, 0.4);
    }

    .btn-close:hover {
      background: rgba(248, 113, 113, 0.3);
    }

    .status-message {
      padding: 12px 16px;
      border-radius: 8px;
      margin-top: 16px;
      display: none;
      font-weight: 600;
    }

    .status-message.success {
      display: block;
      background: rgba(52, 211, 153, 0.2);
      border: 1px solid rgba(52, 211, 153, 0.4);
      color: var(--green);
    }

    .status-message.error {
      display: block;
      background: rgba(248, 113, 113, 0.2);
      border: 1px solid rgba(248, 113, 113, 0.4);
      color: var(--red);
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      display: none;
    }

    .data-table.active {
      display: table;
    }

    .data-table th {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      padding: 12px;
      text-align: left;
      font-weight: 600;
      border-bottom: 2px solid rgba(56, 189, 248, 0.3);
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
    }

    .data-table td {
      padding: 12px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.1);
      color: var(--text);
    }

    .data-table tr:hover {
      background: rgba(56, 189, 248, 0.05);
    }

    @media (max-width: 768px) {
      .dashboard {
        padding: 16px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .button-group {
        flex-direction: column;
      }

      .btn-submit, .btn-reset, .btn-close {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <div class="header">
      <h1>📊 NM Offset Monitoring Dashboard</h1>
      <div class="live-pill"><span class="live-dot"></span> Live Online</div>
    </div>

    <!-- Main Navigation Buttons -->
    <div class="button-container">
      <button class="dash-btn btn-nm" onclick="toggleForm('nmForm')">
        <span class="icon">📈</span>
        <span>NM & Offset</span>
      </button>
      <button class="dash-btn btn-reports" onclick="toggleForm('reportsForm')">
        <span class="icon">📋</span>
        <span>Reports</span>
      </button>
    </div>

    <!-- NM & Offset Form -->
    <div id="nmForm" class="form-container">
      <div class="form-title">
        <span>📈</span> NM & Offset Management
      </div>

      <!-- Input Section -->
      <div class="form-section">
        <div class="section-header">Input Data</div>
        <div class="form-grid">
          <div class="form-group">
            <label>Date</label>
            <input type="date" id="nmDate" />
          </div>
          <div class="form-group">
            <label>MFO Name</label>
            <input type="text" id="mfoName" placeholder="Enter MFO name" />
          </div>
          <div class="form-group">
            <label>New Members (NM)</label>
            <input type="number" id="nm" placeholder="0" oninput="computeNetNM()" />
          </div>
          <div class="form-group">
            <label>Offset</label>
            <input type="number" id="offset" placeholder="0" oninput="computeNetNM()" />
          </div>
        </div>
      </div>

      <!-- Computed Section -->
      <div class="form-section">
        <div class="section-header">Computed Values</div>
        <div class="form-grid">
          <div class="form-group">
            <label>Net NM (New Members - Offset)</label>
            <div class="display-value" id="netNMDisplay">0</div>
          </div>
          <div class="form-group">
            <label>NM Target</label>
            <input type="number" id="nmTarget" placeholder="Target value" />
          </div>
          <div class="form-group">
            <label>Target Offset</label>
            <input type="number" id="targetOffset" placeholder="Target offset" />
          </div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="button-group">
        <button class="btn-submit" onclick="submitNMData()">Submit Data</button>
        <button class="btn-reset" onclick="resetNMForm()">Reset</button>
        <button class="btn-close" onclick="toggleForm('nmForm')">Close</button>
      </div>

      <div id="nmStatus" class="status-message"></div>
    </div>

    <!-- Reports Form -->
    <div id="reportsForm" class="form-container">
      <div class="form-title">
        <span>📋</span> Reports & Summary
      </div>

      <div class="form-section">
        <div class="section-header">Submitted Data Summary</div>
        <table class="data-table" id="dataTable">
          <thead>
            <tr>
              <th>Date</th>
              <th>MFO Name</th>
              <th>NM</th>
              <th>Offset</th>
              <th>Net NM</th>
              <th>NM Target</th>
              <th>Target Offset</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="dataTableBody">
          </tbody>
        </table>
        <p id="noDataMessage" style="text-align: center; color: var(--muted); margin-top: 20px;">
          No data submitted yet. Go to "NM & Offset" tab to add data.
        </p>
      </div>

      <div class="button-group">
        <button class="btn-submit" onclick="exportData()">Export to CSV</button>
        <button class="btn-close" onclick="toggleForm('reportsForm')">Close</button>
      </div>
    </div>
  </div>

  <script>
    // Initialize data storage
    let nmDataStorage = JSON.parse(localStorage.getItem('nmData')) || [];

    function toggleForm(formId) {
      const form = document.getElementById(formId);
      form.classList.toggle('active');
      if (formId === 'reportsForm' && form.classList.contains('active')) {
        displayDataTable();
      }
    }

    function computeNetNM() {
      const nm = parseFloat(document.getElementById('nm').value) || 0;
      const offset = parseFloat(document.getElementById('offset').value) || 0;
      const netNM = nm - offset;
      document.getElementById('netNMDisplay').textContent = netNM;
    }

    function submitNMData() {
      const date = document.getElementById('nmDate').value;
      const mfoName = document.getElementById('mfoName').value.trim();
      const nm = parseFloat(document.getElementById('nm').value) || 0;
      const offset = parseFloat(document.getElementById('offset').value) || 0;
      const netNM = nm - offset;
      const nmTarget = parseFloat(document.getElementById('nmTarget').value) || 0;
      const targetOffset = parseFloat(document.getElementById('targetOffset').value) || 0;

      if (!date || !mfoName) {
        showStatus('Error: Please fill in Date and MFO Name', 'error', 'nmStatus');
        return;
      }

      const record = { date, mfoName, nm, offset, netNM, nmTarget, targetOffset, timestamp: new Date().toLocaleString() };
      nmDataStorage.push(record);
      localStorage.setItem('nmData', JSON.stringify(nmDataStorage));
      
      showStatus('✓ Data submitted successfully!', 'success', 'nmStatus');
      resetNMForm();
    }

    function resetNMForm() {
      document.getElementById('nmDate').value = '';
      document.getElementById('mfoName').value = '';
      document.getElementById('nm').value = '';
      document.getElementById('offset').value = '';
      document.getElementById('nmTarget').value = '';
      document.getElementById('targetOffset').value = '';
      document.getElementById('netNMDisplay').textContent = '0';
      document.getElementById('nmStatus').classList.remove('success', 'error');
    }

    function displayDataTable() {
      const tbody = document.getElementById('dataTableBody');
      const noDataMsg = document.getElementById('noDataMessage');
      const table = document.getElementById('dataTable');

      if (nmDataStorage.length === 0) {
        tbody.innerHTML = '';
        noDataMsg.style.display = 'block';
        table.classList.remove('active');
        return;
      }

      table.classList.add('active');
      noDataMsg.style.display = 'none';
      tbody.innerHTML = nmDataStorage.map((record, index) => `
        <tr>
          <td>${record.date}</td>
          <td>${record.mfoName}</td>
          <td>${record.nm}</td>
          <td>${record.offset}</td>
          <td><strong>${record.netNM}</strong></td>
          <td>${record.nmTarget}</td>
          <td>${record.targetOffset}</td>
          <td><button class="btn-close" onclick="deleteRecord(${index})" style="padding: 6px 12px; font-size: 0.85rem;">Delete</button></td>
        </tr>
      `).join('');
    }

    function deleteRecord(index) {
      if (confirm('Are you sure you want to delete this record?')) {
        nmDataStorage.splice(index, 1);
        localStorage.setItem('nmData', JSON.stringify(nmDataStorage));
        displayDataTable();
      }
    }

    function exportData() {
      if (nmDataStorage.length === 0) {
        alert('No data to export');
        return;
      }

      let csv = 'Date,MFO Name,NM,Offset,Net NM,NM Target,Target Offset\n';
      nmDataStorage.forEach(record => {
        csv += `"${record.date}","${record.mfoName}",${record.nm},${record.offset},${record.netNM},${record.nmTarget},${record.targetOffset}\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `nm_offset_report_${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
      window.URL.revokeObjectURL(url);
    }

    function showStatus(message, type, elementId) {
      const statusEl = document.getElementById(elementId);
      statusEl.textContent = message;
      statusEl.className = `status-message ${type}`;
      setTimeout(() => {
        statusEl.classList.remove('success', 'error');
      }, 5000);
    }

    // Set today's date as default
    window.addEventListener('load', () => {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('nmDate').value = today;
    });
  </script>
</body>
</html>
